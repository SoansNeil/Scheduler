<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CPU Scheduler</title>
	<meta name="description" content="Explore CPU scheduling algorithms and compare their results.">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1><!-- TODO: Add the page heading. -->CPU Scheduler</h1>
		<p><!-- TODO: Briefly describe what this page does. --></p>
	</header>

	<main>
		<section class="process-entry" aria-labelledby="process-entry-heading">
			<h2 id="process-entry-heading">Add a process</h2>
			<form id="process-form" class="process-fields">
				<div class="process-field">
					<label for="process-name">Process name</label>
					<input id="process-name" name="process-name" type="text" placeholder="e.g. P1" required>
				</div>
				<div class="process-field">
					<label for="burst-time">Burst time</label>
					<input id="burst-time" name="burst-time" type="number" min="1" step="1" placeholder="e.g. 5" required>
				</div>
				<div class="process-field">
					<label for="arrival-time">Arrival time</label>
					<input id="arrival-time" name="arrival-time" type="number" min="0" step="1" placeholder="e.g. 0" required>
				</div>
				<div class="process-actions">
					<button type="submit">Add process</button>
					<button id="clear-schedule" class="secondary-button" type="button">Clear schedule</button>
				</div>
			</form>
		</section>

		<figure class="gantt-chart" aria-labelledby="gantt-heading">
			<h2 id="gantt-heading">Gantt chart</h2>
			<fieldset class="policy-options">
				<legend>Scheduling policies</legend>
				<label><input type="radio" name="policy" value="fcfs" checked> First Come, First Served (FCFS)</label>
				<label><input type="radio" name="policy" value="sjf"> Shortest Job First (SJF)</label>
				<label><input type="radio" name="policy" value="srtf"> Shortest Remaining Time First (SRTF)</label>
				<label><input type="radio" name="policy" value="round-robin"> Round Robin</label>
			</fieldset>
			<div id="cycle-time-field" class="cycle-time-field" hidden>
				<label for="cycle-time">Cycle time (time quantum)</label>
				<input id="cycle-time" name="cycle-time" type="number" min="1" step="1" placeholder="e.g. 2">
			</div>
			<p id="schedule-status" class="schedule-status" aria-live="polite"></p>
			<div class="gantt-scroll">
				<table>
					<caption class="visually-hidden">Add processes to generate an FCFS schedule.</caption>
					<colgroup>
						<col class="cpu-label-column">
					</colgroup>
					<thead>
						<tr>
							<th scope="col">CPU</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<th scope="row">CPU</th>
							<td class="empty-chart" colspan="1">Add processes to see the schedule.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</figure>

		<section class="full-width-section" aria-labelledby="processes-heading">
			<h2 id="processes-heading">Processes</h2>
			<div class="process-list-scroll">
				<table class="process-list">
					<thead>
						<tr>
							<th scope="col">Process</th>
							<th scope="col">Burst time</th>
							<th scope="col">Arrival time</th>
						</tr>
					</thead>
					<tbody id="process-list">
						<tr class="empty-processes">
							<td colspan="3">No processes added yet.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>

		<section class="full-width-section" aria-labelledby="results-heading">
			<h2 id="results-heading">Results</h2>
			<div class="results-table-scroll">
				<table class="results-table">
					<thead>
						<tr>
							<th scope="col">Process</th>
							<th scope="col">Completion time</th>
							<th scope="col">Turnaround time</th>
							<th scope="col">Waiting time</th>
							<th scope="col">Response time</th>
						</tr>
					</thead>
					<tbody id="results-list">
						<tr class="empty-processes">
							<td colspan="5">Add processes to calculate results.</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="results-averages" aria-live="polite">
				<p>Average turnaround time: <output id="average-turnaround">—</output></p>
				<p>Average waiting time: <output id="average-waiting">—</output></p>
			</div>
		</section>
	</main>

	<footer>
		<!-- TODO: Add any footer content. -->
	</footer>

	<script src="scheduler.js" defer></script>
</body>
</html>
